[package]
name = "autopilot"
version = "0.4.1"
edition = "2024"
authors = ["Michael Sanders <crates@michaelsande.rs>"]
description = "A simple, cross-platform GUI automation library for Rust."
homepage = "https://www.autopy.org"
readme = "README.md"
repository = "https://github.com/autopilot-rs/autopilot-rs"
license = "MIT OR Apache-2.0"
keywords = ["cross-platform", "gui", "automation", "input", "simulation"]
categories = [
    "api-bindings",
    "gui",
    "os::macos-apis",
    "os::unix-apis",
    "os::windows-apis",
]

[dependencies]
image = "0.25.10"
libc = "0.2.189"
rand = "0.10.3"
scopeguard = "1.2.0"

[dev-dependencies]
quickcheck = "1.1.0"

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3.34"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["highsierra"] }
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = "2.21.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "libloaderapi",
    "minwindef",
    "winbase",
    "winuser",
] }
